<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"
     width="1000" height="1000" role="img" aria-label="Estudio Raíz">

  <!-- Favicon Estudio Raíz · versión simplificada, legible desde 32 px.
       Se omiten las ramas secundarias y el par de hojas medio, y se
       engrosan los trazos para que el dibujo no se cierre al reducirse. -->

  <defs>
    <path id="f-hoja" d="M0 0 C 24 -25, 64 -27, 100 0 C 64 27, 24 25, 0 0 Z"/>
  </defs>

  <rect width="1000" height="1000" rx="190" fill="#0B283D"/>

  <g transform="translate(500 512) scale(0.82) translate(-500 -512)">
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#7FA886">
        <path d="M500 782 C 500 818, 500 852, 500 884" stroke-width="20"/>
        <path d="M492 782 C 470 812, 432 842, 388 862" stroke-width="18"/>
        <path d="M508 782 C 530 812, 568 842, 612 862" stroke-width="18"/>
        <path d="M150 784 L850 784" stroke-width="14" stroke-opacity="0.5"/>
      </g>
      <path d="M500 782 L500 296" stroke-width="30"/>
      <path d="M470 352 C 376 372, 232 468, 232 616 C 232 710, 330 768, 446 784" stroke-width="42"/>
      <path d="M530 352 C 624 372, 768 468, 768 616 C 768 710, 670 768, 554 784" stroke-width="42"/>
    </g>

    <g fill="#7FA886">
      <use href="#f-hoja" transform="translate(500 286) rotate(-90) scale(1.95)"/>
      <use href="#f-hoja" transform="translate(466 356) rotate(218) scale(1.72)"/>
      <use href="#f-hoja" transform="translate(534 356) rotate(-38) scale(1.72)"/>
      <use href="#f-hoja" transform="translate(240 566) rotate(194) scale(1.55)"/>
      <use href="#f-hoja" transform="translate(760 566) rotate(-14) scale(1.55)"/>
    </g>
